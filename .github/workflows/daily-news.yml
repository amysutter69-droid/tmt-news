name: Daily TMT News Digest

on:
  schedule:
    # Runs at 7:00 AM EST (12:00 UTC) every day
    - cron: '0 12 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news scraper
        run: python main.py --format email --max 10

      - name: Get output filename
        id: get-file
        run: |
          FILE=$(ls -t output/*_email.txt | head -1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Found file: $FILE"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "TMT News Digest - ${{ github.event.repository.updated_at || 'Daily' }}"
          to: amysutter@me.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: file://${{ steps.get-file.outputs.file }}
