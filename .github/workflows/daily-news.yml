name: Daily TMT News Digest

on:
  schedule:
    # Target: inbox by 7:00 AM ET. GitHub cron is UTC and runs are often
    # delayed 1-2h at busy times, so fire at 09:40 UTC (5:40 AM EDT /
    # 4:40 AM EST) at an off-peak minute to leave plenty of buffer.
    - cron: '40 9 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news scraper
        run: python main.py --format email --max 10
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Get output filename
        id: get-file
        run: |
          FILE=$(ls -t output/*_email.txt | head -1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Found file: $FILE"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Semiconductor & Hardware Daily"
          to: ${{ secrets.GMAIL_USERNAME }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: file://${{ steps.get-file.outputs.file }}
