name: Weekly Podcast Investor Digest

on:
  schedule:
    # Every Monday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:   # manual trigger for testing

jobs:
  podcast-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run podcast digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional: set to a different address if you want to send to someone else
          DIGEST_TO_EMAIL: ${{ secrets.GMAIL_USERNAME }}
        run: python podcast_digest.py --days 7
